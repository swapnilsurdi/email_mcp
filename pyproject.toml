[project]
name = "email-mcp"
version = "0.1.1"
description = "Local MCP server for multi-account IMAP/SMTP email (tested on iCloud)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Swapnil Surdi" }]
keywords = ["mcp", "email", "imap", "smtp", "icloud", "claude", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
dependencies = [
    "mcp>=1.2.0",
    "keyring>=25.0.0",
    "beautifulsoup4>=4.12.0",
    "PyYAML>=6.0",
    "certifi>=2024.0.0",
]

[project.urls]
Homepage = "https://github.com/swapnilsurdi/email_mcp"
Repository = "https://github.com/swapnilsurdi/email_mcp"
Issues = "https://github.com/swapnilsurdi/email_mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# The multi-tenant HTTP service (web dashboard + scoped agent keys + Matrix bot).
# The stdio MCP install stays lean without it.
http = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "jinja2>=3.1.0",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
]

[project.scripts]
email-mcp = "email_mcp.server:main"
email-mcp-http = "email_mcp.http.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_mcp"]

# Allowlist what ships in the sdist so it matches the clean wheel — never the real
# config/accounts.yml, docs/, or tests/ (all contain the owner's real name/emails).
[tool.hatch.build.targets.sdist]
include = [
    "src/email_mcp",
    "config/accounts.example.yml",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
